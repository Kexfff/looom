[package]
name = "looom"
version = "0.2.0"
edition = "2024"
default-run = "looom"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0"
yaml-rust2 = { version = "0.13", default-features = false }
sha2 = "0.10"
libc = "0.2"
zeroize = "1"
libloading = "0.8"
tempfile = "3"
rpassword = "7"

[dev-dependencies]
