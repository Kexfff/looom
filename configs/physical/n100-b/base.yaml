schema: 1
source:
  profile: arch
  snapshot: "2026-10-03"
system:
  hostname: looom-pc
  timezone: Europe/Moscow
  locale: en_US.UTF-8
  console_keymap: us
kernel:
  package: linux-lts
desktop:
  environment: plasma
packages: [intel-ucode, pciutils, tree]
accounts:
  user:
    name: owner
    uid: 1000
    gid: 1000
    groups: [wheel]
    shell: /bin/bash
    password_secret: login-owner
  root:
    password_secret: login-root
units:
  sshd.service: enabled
  systemd-tpm2-setup-early.service: masked
  systemd-pcrproduct.service: masked
  systemd-pcrlogin@.service: masked
  bluetooth.service: masked
files:
  /etc/looom-hardware-generation:
    content: "n100-b\n"
    owner: root
    group: root
    mode: "0644"
persistent:
  directories:
    /etc/NetworkManager/system-connections:
      id: network-connections
      owner: root
      group: root
      mode: "0700"
    /etc/looom-local:
      id: local-settings
      owner: root
      group: root
      mode: "0700"
health:
  required_units: [sshd.service, NetworkManager.service]
